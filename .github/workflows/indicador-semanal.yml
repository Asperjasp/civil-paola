name: Revisar publicación ICOCED
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar un nuevo boletín oficial
        run: python scripts/update_city_indicator.py
      - name: Guardar cambio verificado
        run: |
          if git diff --quiet -- public/data/indicadores.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/indicadores.json
          git commit -m 'Actualizar referencia del boletín ICOCED'
          git push
